name: send-push
on:
  schedule:
    - cron: '17 * * * *'   # احتياطي كل ساعة؛ التشغيل السريع يأتي من cron-job.org
  workflow_dispatch:
concurrency:
  group: send-push
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  push:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Hebron
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install firebase-admin@12 --no-save
      - run: node scripts/send-push.js
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
